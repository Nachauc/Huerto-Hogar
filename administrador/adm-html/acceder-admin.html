<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../style/style.css">

    <title>Acceder adm</title>
</head>

<body class="bg-light d-flex flex-column min-vh-100">
    <header class="navbar-dark bg-dark px-4 py-3 shadow-sm d-flex justify-content-between align-items-center">
        <a class="navbar-brand d-flex align-items-center gap-2 py-0" href="/html/main-logout.html">
            <img src="/administrador/adm-img/HuertoHogar.png" alt="Huerto Hogar" class="logo-navbar" height="50">
            <span class="fw-semibold">Huerto Hogar</span>
        </a>
        <ul class="navbar-nav list-unstyled mb-0 small text-end">
            <li class="nav-item">
                <a class="nav-link py-0 fw-semibold" href="/html/acceder.html">Acceder como
                    Cliente</a>
            </li>
        </ul>
    </header>

    <main class="container d-flex flex-grow-1 align-items-center justify-content-center py-4">
        <div class="card p-4 shadow-sm border-0" style="max-width: 380px; width: 100%;">
            <div class="text-center mb-3">
                <img src="/administrador/adm-img/HuertoHogar.png" alt="logo" height="60" class="mb-2">
                <h4 class="fw-bold m-0">Inicio de Sesión Administrador</h4>
            </div>

            <form action="/administrador/adm-html/admin.html">
                <div class="mb-3">
                    <label for="email" class="form-label small mb-1">Correo Electrónico</label>
                    <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label small mb-1">contraseña</label>
                    <input type="password" id="password" class="form-control" placeholder="*********" required>
                </div>

                <div class="acceder">
                    <div class="btn-envio">
                        <a href="/administrador/adm-html/admin.html" class="btn btn-success py-2"
                            href="/administrador/adm-html/admin.html">Acceder</a>
                    </div>
                    <a href="#">Recuperar contraseña</a>
                </div>
            </form>


        </div>
    </main>

    <footer class="bg-dark text-white-50 text-center py-3 small mt-auto">
        <p>&copy 2026 🌱 Huerto Hogar | Del campo al hogar 🏠 - Version 1.0</p>
    </footer>

    <script src="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
