       <nav class="navbar navbar-expand-lg bg-body-tertiary">

                <a class="navbar-brand d-flex align-item-center gap-2 py-0" href="index.html">

                    <span>Huerto Hogar</span>
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
                    aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNavDropdown">

                    <ul class="navbar-nav align-item-center me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="#">Productos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Nosotros</a>
                        </li>
                        <li class="nav-item">       
                            <a class="nav-link" href="#">Blogs</a>
                        </li>
                         <li class="nav-item">
                            <a class="nav-link" href="#">Contacto</a>
                         </li>
                         <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                                aria-expanded="false">
                                Perfil
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#">Gestionar Perfil</a></li>
                                <li><a class="dropdown-item" href="#">Mis Pedidos</a></li>
                                <li><a class="dropdown-item" href="#">Seguimiento</a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
                <div class="d-flex align-items-center gap-3">

                    <button type="button" class="btn btn-outline-success">
                        🛒 Carrito de compras
                    </button>
            
                </div>
            </div>
        </nav>

    </header>
    <main>
        <section id="formularioContacto">
            <div class="contenedor">
                <div class="logo">
                    <img src="../img/HuertoHogar.png" alt="logo huerto hogar" class="logo-formulario">
                    <h2>Formulario de Contacto</h2>
                    <div class="form-floating mb-4">
                        <input type="nombre" class="form-control" id="floatingInputNombre" placeholder="Pepito Perez">
                        <label for="floatingInput">Nombre Completo</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="floatingInputEmail" placeholder="name@example.com">
                        <label for="floatingInput">Correo Electronico</label>
                    </div>
                    <div class="form-floating py-2">
                        <textarea class="form-control" placeholder="Leave a comment here" id="floatingTextarea2"
                            style="height: 100px"></textarea>
                        <label for="floatingTextarea2">Mensaje</label>
                    </div>
                    <div class="btn-envio">
                        <button type="button" class="btn btn-success py-2">Enviar Mensaje</button>
                    </div>
                </div>
        
            </div>
        
        
        </section>

    </main>

    <footer>

    </footer>
